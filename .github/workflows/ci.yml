name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The official installer rather than a third-party action: one less
      # version to pin and one less thing that can change under CI.
      - name: Install clj-kondo
        run: |
          curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
          chmod +x install-clj-kondo
          ./install-clj-kondo --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Zero warnings. A warning is a failed contract, not noise.
      - name: Lint
        run: clj-kondo --lint src test

      # The manifest contract tests and the copy completeness law run here.
      - name: Test
        run: pnpm test

      # No asset roots exist on a runner, so this also proves the claim that
      # zero staged assets is a valid build: the galleries render empty rather
      # than shipping 400 dangling references.
      - name: Build
        run: pnpm build

      - name: Show build output
        run: find dist/site -mindepth 1 | sort

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/site
          if-no-files-found: error
