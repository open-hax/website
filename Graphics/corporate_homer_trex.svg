<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Corporate Background -->
  <rect width="500" height="400" fill="#f0f0f0" />
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="12" fill="#999">ASSET ID: SHR-LBA-001 // Q3 SYNERGY-MAP</text>
  
  <!-- T-Rex (Legacy Biological Asset) -->
  <g transform="translate(150, 150)">
    <!-- Tail -->
    <path d="M 0 100 L -100 150 L 0 120 Z" fill="#4CAF50" />
    <!-- Body -->
    <ellipse cx="100" cy="100" rx="80" ry="50" fill="#4CAF50" />
    <!-- Legs -->
    <rect x="60" y="130" width="30" height="60" fill="#388E3C" />
    <rect x="110" y="130" width="30" height="60" fill="#388E3C" />
    <!-- Neck/Head -->
    <path d="M 160 80 Q 200 50 220 80" stroke="#4CAF50" stroke-width="40" fill="none" stroke-linecap="round" />
    <ellipse cx="220" cy="80" rx="30" ry="20" fill="#4CAF50" />
    <!-- Eye -->
    <circle cx="235" cy="75" r="3" fill="black" />
  </g>

  <!-- Homer (Standardized Humanoid Resource) -->
  <g transform="translate(230, 110)">
    <!-- Body/Shirt -->
    <rect x="0" y="20" width="40" height="50" rx="10" fill="white" stroke="#ccc" />
    <!-- Pants -->
    <rect x="0" y="70" width="40" height="20" rx="5" fill="#3F51B5" />
    <!-- Head -->
    <circle cx="20" cy="10" r="20" fill="#FFD700" />
    <!-- Muzzle -->
    <path d="M 10 15 Q 20 30 30 15" fill="#EAD7B8" stroke="#BDB76B" />
    <!-- Eyes -->
    <circle cx="13" cy="5" r="5" fill="white" stroke="black" />
    <circle cx="27" cy="5" r="5" fill="white" stroke="black" />
    <circle cx="13" cy="5" r="1.5" fill="black" />
    <circle cx="27" cy="5" r="1.5" fill="black" />
  </g>

  <!-- Compliance Stamp -->
  <g transform="translate(380, 320) rotate(-15)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="none" stroke="#D32F2F" stroke-width="3" />
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D32F2F" text-anchor="middle">CERTIFIED</text>
    <text x="50" y="35" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#D32F2F" text-anchor="middle">COMPLIANT</text>
  </g>
</svg>
